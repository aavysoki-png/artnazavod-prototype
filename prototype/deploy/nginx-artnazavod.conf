# Конфигурация боевого ВПС (art.sibur.ru / 194.58.118.240), кладётся в
# /etc/nginx/sites-available/artnazavod. Держится в репозитории, чтобы
# настройка сервера была воспроизводима, а не жила только на самой машине;
# deploy-prod.sh заливает этот файл при каждом деплое.
#
# Раздел на sibur.ru подключается проксированием на этот сервер.

# Пока раздел не подключён к sibur.ru, обращения напрямую по IP закрываем от
# поисковых роботов. Заголовок выставляется ТОЛЬКО когда Host — голый IP:
# запросы, пришедшие через прокси, идут с доменным Host и noindex не получают,
# иначе мы бы своими руками запретили индексацию будущей страницы sibur.ru.
map $host $artnazavod_robots {
	default              "";
	"194.58.118.240"     "noindex, nofollow";
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/artnazavod;
	index index.html;

	server_tokens off;
	add_header X-Robots-Tag $artnazavod_robots always;

	# Клиентский роутинг: любой путь отдаёт index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Имена файлов сборки содержат хеш содержимого — можно кэшировать навсегда.
	location /assets/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Robots-Tag $artnazavod_robots always;
	}

	# Фото и видео заказчика лежат под СТАБИЛЬНЫМИ именами (photos/<slug>/01.jpg,
	# hero/hero-1.mp4 — нумерация из генератора), а содержимое под этими именами
	# меняется при каждой правке фактуры: снятый ролик шапки, новая обложка,
	# другой порядок фото. Поэтому здесь no-cache — не «не кэшировать», а
	# «кэшировать, но каждый раз переспрашивать»: браузер шлёт If-None-Match и
	# почти всегда получает пустой 304, а при подмене файла — новый.
	#
	# Ранее тут стояло expires 7d, и это давало ровно тот баг, ради которого
	# написан комментарий: заказчик снял ролик из шапки, сервер уже отдавал
	# новый файл, а в браузере продолжал играть старый под тем же именем —
	# до истечения недели.
	location ~* \.(jpg|jpeg|png|svg|webp|mp4|webm|woff2?|ttf)$ {
		add_header Cache-Control "no-cache";
		add_header X-Robots-Tag $artnazavod_robots always;
	}

	# index.html не кэшируем — иначе после деплоя браузер продолжит грузить
	# старые хеши ассетов, которых уже нет.
	location = /index.html {
		add_header Cache-Control "no-store, no-cache, must-revalidate";
		add_header X-Robots-Tag $artnazavod_robots always;
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
	# Видео и jpg жать бессмысленно — они уже сжаты.

	access_log /var/log/nginx/artnazavod.access.log;
	error_log  /var/log/nginx/artnazavod.error.log;
}
